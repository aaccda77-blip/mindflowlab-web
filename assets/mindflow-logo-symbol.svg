<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f2922"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    
    <!-- Water Flow Gradient (癸水: 치유와 지혜의 물길) -->
    <linearGradient id="waterFlow" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Wood Sprout Growth Gradient (乙木: 성장과 번영의 생명력) -->
    <linearGradient id="leafGrowth" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Golden Diamond Heart (辛金 + 巳火: 내면의 보석과 따뜻한 심장 케어) -->
    <linearGradient id="goldHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Radiant Glow -->
    <filter id="radiantGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base (Rounded Emblem) -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Water Wave Base (마인드플로우 물결) -->
  <path d="M26 80 C 35 88, 55 92, 74 84 C 62 82, 48 76, 38 68 Z" fill="url(#waterFlow)" opacity="0.8"/>
  <path d="M30 84 C 44 92, 65 92, 85 82 C 72 82, 54 78, 42 74 Z" fill="url(#waterFlow)" opacity="0.6"/>

  <!-- Left 'M' Wave Pillar (Water flow rising) -->
  <path d="M25 82 C 22 70, 26 50, 36 40 C 42 34, 46 44, 48 52 C 40 56, 34 68, 36 78 C 36 82, 29 85, 25 82 Z" fill="url(#waterFlow)"/>

  <!-- Outer Embrace Ring (Heart/Safe haven) -->
  <path d="M46 54 C 42 42, 50 30, 60 30 C 72 30, 78 40, 74 54 C 70 66, 56 74, 48 76 C 54 70, 64 64, 66 54 C 68 44, 62 38, 56 38 C 50 38, 46 44, 46 54 Z" fill="url(#leafGrowth)" opacity="0.9"/>

  <!-- Flourishing Sprout Leaf (상승하는 을목 생명력) -->
  <path d="M68 44 C 74 30, 84 20, 94 22 C 96 32, 88 44, 76 48 C 82 46, 88 42, 92 36 C 88 44, 80 50, 72 50 Z" fill="url(#leafGrowth)"/>
  <path d="M78 46 C 86 42, 92 46, 96 52 C 90 56, 82 56, 76 50 Z" fill="url(#leafGrowth)" opacity="0.85"/>

  <!-- Center Golden Jewel Heart (辛金 보석 + 巳火 온기 + 마음 케어) -->
  <g filter="url(#radiantGlow)">
    <path d="M58 45 C 55 41, 50 41, 48 44 C 46 47, 47 51, 50 55 L 58 64 L 66 55 C 69 51, 70 47, 68 44 C 66 41, 61 41, 58 45 Z" fill="url(#goldHeart)"/>
    <path d="M58 47 L 52 53 L 58 61 L 64 53 Z" fill="#fef9c3" opacity="0.6"/>
    <path d="M58 47 L 58 61 L 64 53 Z" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Star Sparkle of Insight (알아차림의 빛) -->
  <circle cx="58" cy="45" r="1.5" fill="#ffffff"/>
  <path d="M58 40 L 59 44 L 63 45 L 59 46 L 58 50 L 57 46 L 53 45 L 57 44 Z" fill="#ffffff" opacity="0.8"/>
</svg>
