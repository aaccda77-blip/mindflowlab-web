<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Matte Luxury Charcoal) -->
    <radialGradient id="wcBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e2624"/>
      <stop offset="100%" stop-color="#0b1012"/>
    </radialGradient>

    <!-- Deep Nordic Emerald (Left M Pillar) -->
    <linearGradient id="emeraldDark" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Frosted Jade (Right M & Heart Contour) -->
    <linearGradient id="jadeLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Champagne Gold Diamond (辛金 보석 코어) -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Sprout Growth Gradient (乙木 생명력) -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Container -->
  <rect width="120" height="120" rx="26" fill="url(#wcBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="25" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Main Emblem Group -->
  <g filter="url(#subtleShadow)">
    <!-- Left M Leg & Depth -->
    <path d="M32 78 L32 50 C32 40, 42 34, 52 42 L60 50 L52 58 L44 50 C40 46, 38 48, 38 52 L38 78 Z" fill="url(#emeraldDark)"/>
    <path d="M26 78 L26 48 C26 36, 40 28, 52 38 L60 46 L54 52 L48 44 C40 36, 34 42, 34 48 L34 78 Z" fill="#047857" opacity="0.8"/>

    <!-- Right M Leg & Heart Contour (Caring Embrace) -->
    <path d="M60 50 L68 42 C78 34, 88 40, 88 50 L88 78 L82 78 L82 52 C82 48, 80 46, 76 50 L68 58 Z" fill="url(#jadeLight)"/>
    <path d="M60 46 L72 34 C82 24, 94 34, 94 48 L94 78 L88 78 L88 48 C88 38, 80 32, 72 40 L60 52 Z" fill="#6ee7b7" opacity="0.85"/>

    <!-- Bottom Interlocking V Ribbon (Mindflow Wave & Balance) -->
    <path d="M42 66 L60 84 L78 66 L72 60 L60 72 L48 60 Z" fill="#0d9488"/>

    <!-- Central Champagne Gold Diamond Core (辛金 사주 보석 / 정밀한 지혜 / 내면의 본성) -->
    <g transform="translate(60, 56) rotate(45)">
      <rect x="-7" y="-7" width="14" height="14" rx="2" fill="url(#champagneGold)" stroke="#fef08a" stroke-width="1"/>
      <!-- Inner cutout reflection -->
      <rect x="-3" y="-3" width="6" height="6" fill="#1e2624" opacity="0.9"/>
    </g>

    <!-- Upward Sprouting Leaf of Growth (乙木 회사의 무궁한 번창과 모든 사람의 마음 케어) -->
    <!-- Stem -->
    <path d="M60 49 Q 58 34, 66 22" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Leaf Blade -->
    <path d="M66 22 C 72 26, 75 34, 70 40 C 62 44, 59 36, 66 22 Z" fill="url(#sproutGrad)"/>
    <path d="M66 22 C 67 28, 67 34, 69 39" stroke="#047857" stroke-width="1" fill="none" opacity="0.6"/>
  </g>
</svg>
